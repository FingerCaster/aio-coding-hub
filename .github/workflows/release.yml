name: release

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      release_tag:
        description: "Existing or new tag; Beta requires aio-coding-hub-vX.Y.Z-beta.N"
        required: false
        type: string
      target_commitish:
        description: "Full origin/main commit SHA; required for Beta"
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.manual_release.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.manual_release.outputs.tag_name || steps.release.outputs.tag_name }}
      release_id: ${{ steps.manual_release.outputs.id || steps.release.outputs.id }}
      checkout_ref: ${{ steps.resolve_release_ref.outputs.checkout_ref }}
      release_channel: ${{ steps.resolve_release_ref.outputs.release_channel }}
      release_version: ${{ steps.resolve_release_ref.outputs.release_version }}
      build_matrix: ${{ steps.support_matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate support matrix contract
        run: node scripts/support-matrix.mjs check

      - name: Validate release source resolution
        run: node scripts/release-source.selftest.mjs

      - name: Validate stable and Beta release contracts
        run: node scripts/release-contract.selftest.mjs

      - name: Validate deterministic release version overlay
        run: node scripts/release-version-overlay.selftest.mjs

      - name: Validate release promotion integrity
        run: node scripts/release-promotion.selftest.mjs

      - name: Validate release channel pointer integrity
        run: node scripts/release-channel.selftest.mjs

      - name: Validate release signing secret scope
        run: node scripts/check-release-signing-secret-scope.selftest.mjs && node scripts/check-release-signing-secret-scope.mjs

      - id: support_matrix
        name: Load release support matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "build_matrix=$(node scripts/support-matrix.mjs build-matrix)" >> "$GITHUB_OUTPUT"

      - name: Validate release dispatch inputs
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMITISH: ${{ inputs.target_commitish }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            if [[ -z "$RELEASE_TAG" || -z "$TARGET_COMMITISH" ]]; then
              echo "Beta releases require release_tag and target_commitish." >&2
              exit 1
            fi
            node scripts/release-contract.mjs describe \
              --channel "$RELEASE_CHANNEL" \
              --tag "$RELEASE_TAG" \
              --source-sha "$TARGET_COMMITISH" >/dev/null
          elif [[ "$RELEASE_CHANNEL" != "stable" ]]; then
            echo "Unsupported release channel: $RELEASE_CHANNEL" >&2
            exit 1
          elif [[ -z "$RELEASE_TAG" && -n "$TARGET_COMMITISH" ]]; then
            echo "target_commitish requires an explicit release_tag." >&2
            exit 1
          fi

      - id: release
        if: ${{ inputs.release_channel == 'stable' && inputs.release_tag == '' }}
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: "${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(main): release aio-coding-hub ') }}"
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - id: manual_release
        name: Use or create manual release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMITISH: ${{ inputs.target_commitish }}
        run: |
          set -euo pipefail

          channel="$RELEASE_CHANNEL"
          tag="$RELEASE_TAG"
          target_input="$TARGET_COMMITISH"
          node scripts/release-contract.mjs describe \
            --channel "$channel" \
            --tag "$tag" \
            --source-sha "${target_input:-$GITHUB_SHA}" >/dev/null

          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          tag_exists=false
          if git fetch --force --no-tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
            tag_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          fi

          if [[ -n "$target_input" ]]; then
            target="$target_input"
          elif [[ "$tag_exists" == "true" ]]; then
            target="$tag_sha"
          else
            target="$GITHUB_SHA"
          fi
          if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Manual release target must be a lowercase full commit SHA: $target" >&2
            exit 1
          fi
          git fetch --force --no-tags origin "$target"
          target_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          if [[ "$target_sha" != "$target" ]]; then
            echo "Resolved target $target_sha does not match requested SHA $target." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$target_sha" refs/remotes/origin/main; then
            echo "Release target $target_sha is not reachable from origin/main." >&2
            exit 1
          fi

          if [[ "$tag_exists" == "true" ]]; then
            if [[ "$tag_sha" != "$target_sha" ]]; then
              echo "Release tag $tag resolves to $tag_sha, expected $target_sha." >&2
              exit 1
            fi
          elif ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" \
            -f "sha=$target_sha" >/dev/null; then
            git fetch --force --no-tags origin "refs/tags/$tag"
            raced_tag_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
            if [[ "$raced_tag_sha" != "$target_sha" ]]; then
              echo "Concurrent tag creation selected $raced_tag_sha, expected $target_sha." >&2
              exit 1
            fi
          fi

          git fetch --force --no-tags origin "refs/tags/$tag"
          checkout_ref="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          if [[ "$checkout_ref" != "$target_sha" ]]; then
            echo "Release tag $tag resolves to $checkout_ref, expected $target_sha." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$checkout_ref" refs/remotes/origin/main; then
            echo "Tagged release source $checkout_ref drifted outside origin/main." >&2
            exit 1
          fi

          release_file="$RUNNER_TEMP/manual-release.json"
          release_error="$RUNNER_TEMP/manual-release.err"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >"$release_file" 2>"$release_error"; then
            echo "Using matching empty draft Release for $tag."
          elif grep -q "HTTP 404" "$release_error"; then
            version="${tag#aio-coding-hub-v}"
            notes_file="$RUNNER_TEMP/manual-release-notes.md"
            node - "$version" >"$notes_file" <<'NODE'
          const fs = require('fs');
          const version = process.argv[2];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const lines = changelog.split(/\r?\n/);
          const heading = new RegExp(`^## \\[${version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\]`);
          const start = lines.findIndex((line) => heading.test(line));
          if (start === -1) {
            console.log(`Release ${version}`);
            process.exit(0);
          }
          const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          console.log(lines.slice(start + 1, end === -1 ? lines.length : end).join('\n').trim());
          NODE
            payload_file="$RUNNER_TEMP/manual-release-payload.json"
            prerelease=false
            if [[ "$channel" == "beta" ]]; then prerelease=true; fi
            node - "$tag" "$checkout_ref" "$version" "$notes_file" "$prerelease" "$payload_file" <<'NODE'
          const fs = require('fs');
          const [tag, target, version, notesPath, prerelease, outputPath] = process.argv.slice(2);
          fs.writeFileSync(outputPath, JSON.stringify({
            tag_name: tag,
            target_commitish: target,
            name: `aio-coding-hub: v${version}`,
            body: fs.readFileSync(notesPath, 'utf8'),
            draft: true,
            prerelease: prerelease === 'true',
            make_latest: 'false',
          }));
          NODE
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --input "$payload_file" >"$release_file"
          else
            cat "$release_error" >&2
            exit 1
          fi

          node scripts/release-contract.mjs assert-empty-draft \
            --channel "$channel" \
            --tag "$tag" \
            --source-sha "$checkout_ref" \
            --release-json "$release_file"
          release_id="$(node -e "const r=require(process.argv[1]); process.stdout.write(String(r.id))" "$release_file")"

          {
            echo "release_created=true"
            echo "tag_name=$tag"
            echo "id=$release_id"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - id: resolve_release_ref
        name: Resolve release checkout ref
        if: ${{ steps.manual_release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_TAG: ${{ steps.manual_release.outputs.tag_name || steps.release.outputs.tag_name }}
          FALLBACK_REF: ${{ steps.manual_release.outputs.checkout_ref || github.sha }}
          MANUAL_SOURCE: ${{ steps.manual_release.outputs.checkout_ref }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          channel="$RELEASE_CHANNEL"
          fallback_ref="$FALLBACK_REF"

          if [[ -z "$tag" ]]; then
            echo "Cannot resolve release checkout ref without a release tag." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          fetch_release_tag() {
            for attempt in 1 2 3; do
              if git fetch --force --no-tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                if fetched_tag_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"; then
                  return 0
                fi
              fi
              sleep "$((attempt * 2))"
            done
            return 1
          }

          resolve_commit_sha() {
            local ref="$1"
            if [[ -z "$ref" ]]; then
              echo "Cannot resolve an empty release target." >&2
              return 1
            fi

            if git rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              git rev-parse "${ref}^{commit}"
              return 0
            fi

            if git fetch --no-tags --depth=1 origin "$ref" >/dev/null 2>&1; then
              git rev-parse "FETCH_HEAD^{commit}"
              return 0
            fi

            gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha
          }

          if fetch_release_tag; then
            checkout_ref="$fetched_tag_sha"
            echo "Release tag $tag is fetchable at $checkout_ref."
          else
            if [[ "$channel" == "beta" ]]; then
              echo "Beta release tag disappeared after draft creation: $tag" >&2
              exit 1
            fi
            release_target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish // ""' 2>/dev/null || true)"
            if [[ -z "$release_target" || "$release_target" == "$tag" || ! "$release_target" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              release_target="$fallback_ref"
            fi

            target_sha="$(resolve_commit_sha "$release_target")"
            if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Resolved release target is not a lowercase full commit SHA: $target_sha" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$target_sha" refs/remotes/origin/main; then
              echo "Release target $target_sha is not reachable from origin/main; refusing to create a tag." >&2
              exit 1
            fi
            echo "Release tag $tag is not fetchable; creating lightweight tag at $target_sha."

            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$target_sha" >/tmp/create-release-tag.json 2>/tmp/create-release-tag.err; then
              if ! fetch_release_tag; then
                cat /tmp/create-release-tag.err >&2
                exit 1
              fi
            else
              fetch_release_tag
            fi

            checkout_ref="$fetched_tag_sha"
            if [[ "$checkout_ref" != "$target_sha" ]]; then
              echo "Release tag $tag resolves to $checkout_ref, expected $target_sha." >&2
              exit 1
            fi
          fi

          # Build jobs must checkout an immutable commit SHA. Draft GitHub Releases
          # can exist before their Git tag is fetchable, which breaks tag checkout.
          if ! [[ "$checkout_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release checkout ref is not an immutable commit SHA: $checkout_ref" >&2
            exit 1
          fi
          if [[ -n "$MANUAL_SOURCE" && "$checkout_ref" != "$MANUAL_SOURCE" ]]; then
            echo "Resolved tag source $checkout_ref does not match manual source $MANUAL_SOURCE." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$checkout_ref" refs/remotes/origin/main; then
            echo "Release source $checkout_ref is not reachable from origin/main." >&2
            exit 1
          fi
          identity="$(node scripts/release-contract.mjs describe \
            --channel "$channel" \
            --tag "$tag" \
            --source-sha "$checkout_ref")"
          {
            echo "checkout_ref=$checkout_ref"
            echo "release_channel=$(printf '%s' "$identity" | jq -r .channel)"
            echo "release_version=$(printf '%s' "$identity" | jq -r .version)"
          } >> "$GITHUB_OUTPUT"

      - name: Check release PR changelog range
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.release_created != 'true'
        env:
          RELEASE_PLEASE_PRS: ${{ steps.release.outputs.prs }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: node scripts/check-release-pr-changelog.mjs

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.release-please.outputs.build_matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Apply and attest deterministic release version
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          node scripts/release-version-overlay.mjs apply \
            --root "$GITHUB_WORKSPACE" \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/release-version-attestation-${{ matrix.updater_platform }}.json"
          actual_version="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version" package.json)"
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Overlay version $actual_version does not match workflow version $RELEASE_VERSION." >&2
            exit 1
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Tauri v2 updater key is stored as a single-line base64 string (as generated by `tauri signer generate --ci`).
          # Normalize by stripping whitespace to avoid accidental newline issues in GitHub Secrets.
          normalized_key="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" | tr -d '\r\n\t ')"
          [[ -n "$normalized_key" ]] || {
            echo "Required updater signing key is unavailable." >&2
            exit 1
          }
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" ]] || {
            echo "Required updater signing password is unavailable." >&2
            exit 1
          }

          umask 077
          key_path="$RUNNER_TEMP/tauri-updater.key"
          rm -f "$key_path"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          test_path="$temp_dir/signing-probe.txt"

          printf '::add-mask::%s\n' "$normalized_key"
          printf '::add-mask::%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET"
          printf '%s' "$normalized_key" > "$key_path"
          chmod 600 "$key_path"
          printf '%s\n' 'signing-probe' > "$test_path"

          if ! pnpm exec tauri signer sign \
            -f "$key_path" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" \
            "$test_path" >/dev/null 2>&1; then
            echo "Signing key/password check failed." >&2
            exit 1
          fi

      - id: tauri
        name: Build signed Tauri candidate
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/tauri-updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          includeUpdaterJson: false

      - name: Delete updater signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tauri-updater.key"

      - name: Prepare stable updater assets (+ macOS zip)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/support-matrix.mjs prepare-stable-assets \
            --artifact-paths "$ARTIFACT_PATHS_JSON" \
            --updater-platform "${{ matrix.updater_platform }}" \
            --stable-label "${{ matrix.stable_label }}" \
            --output-dir stable-assets
        env:
          ARTIFACT_PATHS_JSON: ${{ steps.tauri.outputs.artifactPaths }}

      - name: Build macOS zip (portable)
        if: startsWith(matrix.updater_platform, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail

          label="${{ matrix.stable_label }}"
          tgz="stable-assets/aio-coding-hub-${label}.tar.gz"
          if [[ ! -f "$tgz" ]]; then
            echo "Missing tarball: $tgz"
            ls -la stable-assets || true
            exit 1
          fi

          tmp="$(mktemp -d)"
          tar -xzf "$tgz" -C "$tmp"
          app_path="$(find "$tmp" -maxdepth 2 -name "*.app" -type d | head -n 1 || true)"
          if [[ -z "$app_path" ]]; then
            echo "No .app found inside $tgz"
            find "$tmp" -maxdepth 3 -print || true
            exit 1
          fi

          out="stable-assets/aio-coding-hub-${label}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$out"
          echo "Created zip: $out"

      - name: Build Windows portable ZIP
        if: startsWith(matrix.updater_platform, 'windows-')
        shell: pwsh
        run: |
          $label = "${{ matrix.stable_label }}"
          $targetDir = "src-tauri/target/${{ matrix.target }}/release"

          # Find the built application exe, not the bundled setup package.
          $exeName = "AIO Coding Hub.exe"
          $exePath = Join-Path $targetDir $exeName

          if (-not (Test-Path $exePath)) {
            $exeName = "aio-coding-hub.exe"
            $exePath = Join-Path $targetDir $exeName
          }

          if (-not (Test-Path $exePath)) {
            Write-Error "Cannot find built exe in $targetDir"
            Get-ChildItem $targetDir -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          # Create a temp directory for the portable package
          $portableDir = "portable-build/AIO Coding Hub"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null

          # Copy the exe
          Copy-Item $exePath $portableDir

          # Copy resources if they exist (icons, webview assets, etc.)
          $resourceDir = Join-Path $targetDir "resources"
          if (Test-Path $resourceDir) {
            Copy-Item -Recurse $resourceDir (Join-Path $portableDir "resources")
          }

          # Create the ZIP
          $zipPath = "stable-assets/aio-coding-hub-${label}-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipPath -Force

          Write-Host "Created portable ZIP: $zipPath"
          Get-Item $zipPath | Select-Object Name, Length

      - name: Build Wayland-compatible AppImage (Linux only)
        if: startsWith(matrix.updater_platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail

          # Fetch pinned stable release of appimagetool (no FUSE required).
          TOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          TOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          TOOL_BIN="$(mktemp)"
          node scripts/fetch-checked-file.mjs \
            --url "$TOOL_URL" \
            --sha256 "$TOOL_SHA256" \
            --output "$TOOL_BIN"
          chmod +x "$TOOL_BIN"

          label="${{ matrix.stable_label }}"
          src="stable-assets/aio-coding-hub-${label}.AppImage"
          out="stable-assets/aio-coding-hub-${label}-wayland.AppImage"

          APPIMAGETOOL="$TOOL_BIN" ./scripts/repack-linux-appimage-wayland.sh "$src" "$out"

          rm -f "$TOOL_BIN"

          echo "Wayland AppImage: $out"
          ls -lh "$out"

      - name: Upload platform release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-${{ needs.release-please.outputs.checkout_ref }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.updater_platform }}
          path: stable-assets/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload platform version attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-attestation-${{ needs.release-please.outputs.checkout_ref }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.updater_platform }}
          path: ${{ runner.temp }}/release-version-attestation-${{ matrix.updater_platform }}.json
          if-no-files-found: error
          retention-days: 1

  assemble-release-candidate:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_artifact_name: ${{ format('release-candidate-{0}-{1}-{2}', needs.release-please.outputs.checkout_ref, github.run_id, github.run_attempt) }}
      candidate_run_id: ${{ github.run_id }}
      candidate_run_attempt: ${{ github.run_attempt }}
      overlay_digest: ${{ steps.version_attestations.outputs.overlay_digest }}
    steps:
      - name: Checkout candidate manifest helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: workflow-guard

      - name: Stage release candidate manifest helper
        shell: bash
        run: |
          cp workflow-guard/scripts/release-contract.mjs "$RUNNER_TEMP/release-contract.mjs"
          cp workflow-guard/scripts/release-promotion.mjs "$RUNNER_TEMP/release-promotion.mjs"
          cp workflow-guard/scripts/release-version-overlay.mjs "$RUNNER_TEMP/release-version-overlay.mjs"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download platform release candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-${{ needs.release-please.outputs.checkout_ref }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: release-assets

      - name: Download platform version attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-attestation-${{ needs.release-please.outputs.checkout_ref }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: release-attestations

      - id: version_attestations
        name: Verify identical platform version attestations
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          overlay_digest="$(node "$RUNNER_TEMP/release-version-overlay.mjs" verify-attestations \
            --directory release-attestations \
            --platforms "$(node workflow-guard/scripts/support-matrix.mjs updater-platforms)" \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA")"
          echo "overlay_digest=$overlay_digest" >> "$GITHUB_OUTPUT"

      - name: Fetch release body
        id: release_body
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed(`Invalid release_id: ${releaseId}`);
              return;
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            core.setOutput('body', release.body || '');

      - name: Generate latest.json
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_BODY: ${{ steps.release_body.outputs.body }}
          FALLBACK_NOTES: "See release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}"
        run: |
          set -euo pipefail
          node workflow-guard/scripts/support-matrix.mjs generate-latest-json \
            --tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --stable-assets-dir release-assets \
            --output release-assets/latest.json

      - name: Create immutable release candidate manifest
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
          OVERLAY_DIGEST: ${{ steps.version_attestations.outputs.overlay_digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/release-promotion.mjs" create-manifest \
            --directory release-assets \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --release-version "$RELEASE_VERSION" \
            --overlay-digest "$OVERLAY_DIGEST" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ needs.release-please.outputs.checkout_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  promote-release:
    needs: [release-please, assemble-release-candidate]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.assemble-release-candidate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout workflow guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Stage release promotion guard
        shell: bash
        run: |
          cp scripts/release-contract.mjs "$RUNNER_TEMP/release-contract.mjs"
          cp scripts/release-promotion.mjs "$RUNNER_TEMP/release-promotion.mjs"

      - name: Checkout immutable release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.assemble-release-candidate.outputs.candidate_artifact_name }}
          path: release-candidate

      - name: Verify and stage exact release candidate
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
          OVERLAY_DIGEST: ${{ needs.assemble-release-candidate.outputs.overlay_digest }}
          RUN_ID: ${{ needs.assemble-release-candidate.outputs.candidate_run_id }}
          RUN_ATTEMPT: ${{ needs.assemble-release-candidate.outputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/release-promotion.mjs" verify-and-stage \
            --directory release-candidate \
            --staging-directory promotion-assets \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --release-version "$RELEASE_VERSION" \
            --overlay-digest "$OVERLAY_DIGEST" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"

      - name: Verify release tag still matches candidate SHA
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG resolves to $tag_sha, expected $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Verify empty draft release target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs');
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              assertReleasePromotionTarget,
              parseReleaseCandidateManifest,
            } = await import(
              pathToFileURL(`${process.env.RUNNER_TEMP}/release-promotion.mjs`).href,
            );
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed(`Invalid release_id: ${releaseId}`);
              return;
            }
            const manifest = parseReleaseCandidateManifest(
              readFileSync(
                join(process.env.GITHUB_WORKSPACE, 'release-candidate', 'release-candidate.json'),
                'utf8',
              ),
            );
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            assertReleasePromotionTarget({
              release,
              expectedReleaseId: releaseId,
              expectedTag: process.env.RELEASE_TAG,
              expectedChannel: process.env.RELEASE_CHANNEL,
              expectedSourceSha: process.env.SOURCE_SHA,
              candidateAssetNames: manifest.assets.map((asset) => asset.name),
            });
            core.info(`Release ${process.env.RELEASE_TAG} is an empty verified draft.`);

      - id: upload_assets
        name: Upload verified candidate assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: promotion-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
          # Keep the target draft until the separate publication verification passes.
          draft: true
          prerelease: ${{ needs.release-please.outputs.release_channel == 'beta' }}
          make_latest: false

      - name: Verify uploaded draft assets
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
          UPLOADED_RELEASE_ID: ${{ steps.upload_assets.outputs.id }}
          UPLOADED_ASSETS: ${{ steps.upload_assets.outputs.assets }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs');
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              assertReleasePublicationTarget,
              parseReleaseCandidateManifest,
            } = await import(
              pathToFileURL(`${process.env.RUNNER_TEMP}/release-promotion.mjs`).href,
            );
            const releaseId = Number(process.env.RELEASE_ID);
            const uploadedReleaseId = Number(process.env.UPLOADED_RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed(`Invalid release_id: ${releaseId}`);
              return;
            }
            let uploadedAssets;
            try {
              uploadedAssets = JSON.parse(process.env.UPLOADED_ASSETS || '[]');
            } catch (error) {
              core.setFailed(`Invalid uploaded asset output: ${error}`);
              return;
            }
            const manifest = parseReleaseCandidateManifest(
              readFileSync(
                join(process.env.GITHUB_WORKSPACE, 'release-candidate', 'release-candidate.json'),
                'utf8',
              ),
            );
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            assertReleasePublicationTarget({
              release,
              expectedReleaseId: releaseId,
              expectedTag: process.env.RELEASE_TAG,
              expectedChannel: process.env.RELEASE_CHANNEL,
              expectedSourceSha: process.env.SOURCE_SHA,
              candidateManifest: manifest,
              uploadedReleaseId,
              uploadedAssets,
            });
            core.info(`Verified all ${manifest.assets.length} uploaded draft assets.`);

  publish:
    needs: [release-please, assemble-release-candidate, promote-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout publication guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage release publication guard
        shell: bash
        run: |
          cp scripts/release-contract.mjs "$RUNNER_TEMP/release-contract.mjs"
          cp scripts/release-promotion.mjs "$RUNNER_TEMP/release-promotion.mjs"

      - name: Download exact publication candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.assemble-release-candidate.outputs.candidate_artifact_name }}
          path: release-candidate

      - name: Reverify release tag before publication
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/release-contract.mjs" describe \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" >/dev/null
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG resolves to $tag_sha, expected $SOURCE_SHA." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "Release source $SOURCE_SHA is no longer reachable from origin/main." >&2
            exit 1
          fi

      - name: Verify and publish GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
          OVERLAY_DIGEST: ${{ needs.assemble-release-candidate.outputs.overlay_digest }}
          RUN_ID: ${{ needs.assemble-release-candidate.outputs.candidate_run_id }}
          RUN_ATTEMPT: ${{ needs.assemble-release-candidate.outputs.candidate_run_attempt }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const {
              assertPublishedReleaseTarget,
              assertReleasePublicationTarget,
              verifyReleaseCandidate,
            } = await import(
              pathToFileURL(`${process.env.RUNNER_TEMP}/release-promotion.mjs`).href,
            );
            const releaseId = Number(process.env.RELEASE_ID);
            const runId = Number(process.env.RUN_ID);
            const runAttempt = Number(process.env.RUN_ATTEMPT);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed(`Invalid release_id: ${releaseId}`);
              return;
            }
            const manifest = await verifyReleaseCandidate({
              directory: join(process.env.GITHUB_WORKSPACE, 'release-candidate'),
              channel: process.env.RELEASE_CHANNEL,
              tag: process.env.RELEASE_TAG,
              sourceSha: process.env.SOURCE_SHA,
              releaseVersion: process.env.RELEASE_VERSION,
              overlayDigest: process.env.OVERLAY_DIGEST,
              runId,
              runAttempt,
            });
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });
            assertReleasePublicationTarget({
              release,
              expectedReleaseId: releaseId,
              expectedTag: process.env.RELEASE_TAG,
              expectedChannel: process.env.RELEASE_CHANNEL,
              expectedSourceSha: process.env.SOURCE_SHA,
              candidateManifest: manifest,
            });
            const beta = process.env.RELEASE_CHANNEL === 'beta';
            const { data: published } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
              prerelease: beta,
              make_latest: beta ? 'false' : 'true',
            });
            if (
              published.id !== releaseId ||
              published.tag_name !== process.env.RELEASE_TAG ||
              published.draft !== false ||
              published.prerelease !== beta
            ) {
              core.setFailed('Published release identity did not match the verified draft.');
              return;
            }
            assertPublishedReleaseTarget({
              release: published,
              expectedReleaseId: releaseId,
              expectedTag: process.env.RELEASE_TAG,
              expectedChannel: process.env.RELEASE_CHANNEL,
              expectedSourceSha: process.env.SOURCE_SHA,
              candidateManifest: manifest,
            });
            core.info(`Published verified release ${process.env.RELEASE_TAG}.`);

  publish-release-channel:
    needs: [release-please, assemble-release-candidate, publish]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release channel guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download exact channel candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.assemble-release-candidate.outputs.candidate_artifact_name }}
          path: release-candidate

      - name: Reverify release source before channel publication
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          node scripts/release-contract.mjs describe \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" >/dev/null
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG"
          tag_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG resolves to $tag_sha, expected $SOURCE_SHA." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "Release source $SOURCE_SHA is no longer reachable from origin/main." >&2
            exit 1
          fi

      - name: Publish verified release channel pointer with CAS
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_CHANNEL: ${{ needs.release-please.outputs.release_channel }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
          SOURCE_SHA: ${{ needs.release-please.outputs.checkout_ref }}
          OVERLAY_DIGEST: ${{ needs.assemble-release-candidate.outputs.overlay_digest }}
          RUN_ID: ${{ needs.assemble-release-candidate.outputs.candidate_run_id }}
          RUN_ATTEMPT: ${{ needs.assemble-release-candidate.outputs.candidate_run_attempt }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { compareReleaseVersions } = await import(
              pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts', 'release-contract.mjs')).href,
            );
            const { verifyReleaseCandidate } = await import(
              pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts', 'release-promotion.mjs')).href,
            );
            const { publishReleaseChannel, readReleaseChannelSnapshot } = await import(
              pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts', 'release-channel.mjs')).href,
            );
            const runId = Number(process.env.RUN_ID);
            const runAttempt = Number(process.env.RUN_ATTEMPT);
            const manifest = await verifyReleaseCandidate({
              directory: join(process.env.GITHUB_WORKSPACE, 'release-candidate'),
              channel: process.env.RELEASE_CHANNEL,
              tag: process.env.RELEASE_TAG,
              sourceSha: process.env.SOURCE_SHA,
              releaseVersion: process.env.RELEASE_VERSION,
              overlayDigest: process.env.OVERLAY_DIGEST,
              runId,
              runAttempt,
            });
            const snapshot = await readReleaseChannelSnapshot({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (
              process.env.RELEASE_CHANNEL === 'stable' &&
              snapshot &&
              compareReleaseVersions(
                process.env.RELEASE_VERSION,
                snapshot.state.selected_version,
              ) <= 0
            ) {
              core.info(
                `Stable ${process.env.RELEASE_VERSION} does not advance Beta pointer ${snapshot.state.selected_version}.`,
              );
              return;
            }
            const result = await publishReleaseChannel({
              github,
              fetchImpl: fetch,
              owner: context.repo.owner,
              repo: context.repo.repo,
              action: 'promote',
              tag: process.env.RELEASE_TAG,
              sourceSha: process.env.SOURCE_SHA,
              expectedRefSha: snapshot?.refSha ?? null,
              candidateManifest: manifest,
              workflowRunId: runId,
              workflowRunAttempt: runAttempt,
              operator: context.actor,
              updatedAt: new Date().toISOString(),
            });
            const confirmed = await readReleaseChannelSnapshot({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (confirmed?.refSha !== result.newRefSha) {
              core.setFailed('Release channel ref did not retain the verified CAS commit.');
              return;
            }
            core.info(
              `Published ${process.env.RELEASE_TAG} to release-channels at ${result.newRefSha}.`,
            );

  publish-homebrew-cask:
    needs: [release-please, publish]
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.release-please.outputs.release_channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'FingerCaster/homebrew-aio-coding-hub' }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Generate Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid release ID: $RELEASE_ID" >&2
            exit 1
          fi
          release_assets_api="repos/$RELEASE_REPOSITORY/releases/$RELEASE_ID/assets"

          macos_arm_sha256="$(
            gh api "$release_assets_api" --paginate \
              --jq '.[] | select(.name == "aio-coding-hub-macos-arm.zip") | .digest' \
              | sed 's/^sha256://'
          )"
          macos_intel_sha256="$(
            gh api "$release_assets_api" --paginate \
              --jq '.[] | select(.name == "aio-coding-hub-macos-intel.zip") | .digest' \
              | sed 's/^sha256://'
          )"

          if [[ -z "$macos_arm_sha256" || -z "$macos_intel_sha256" ]]; then
            echo "Missing macOS zip digests for Homebrew Cask generation." >&2
            echo "macos_arm_sha256=${macos_arm_sha256:-<missing>}" >&2
            echo "macos_intel_sha256=${macos_intel_sha256:-<missing>}" >&2
            exit 1
          fi

          node scripts/support-matrix.mjs homebrew-cask \
            --tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --macos-arm-sha256 "$macos_arm_sha256" \
            --macos-intel-sha256 "$macos_intel_sha256" \
            --output generated-homebrew/Casks/aio-coding-hub.rb

      - name: Skip Homebrew tap sync when token is missing
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP_TOKEN is not configured; generated Cask will not be pushed."

      - name: Sync Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # Fail fast with an actionable message when the token cannot access
          # the tap repo — git's own failure mode is a cryptic
          # "could not read Username" prompt.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            "https://api.github.com/repos/${HOMEBREW_TAP_REPOSITORY}")
          if [[ "$status" != "200" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot access ${HOMEBREW_TAP_REPOSITORY} (HTTP ${status}). The PAT must be valid and have contents read/write on the tap repository."
            exit 1
          fi

          git check-ref-format --normalize "refs/heads/main" >/dev/null
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # git-over-HTTPS expects Basic auth (this is what actions/checkout
          # sends); a raw "bearer" header is rejected for some token types.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${HOMEBREW_TAP_TOKEN}" | base64 -w0)"

          git -c http.extraheader="$auth_header" \
            clone "https://github.com/${HOMEBREW_TAP_REPOSITORY}.git" homebrew-tap

          mkdir -p homebrew-tap/Casks
          cp generated-homebrew/Casks/aio-coding-hub.rb homebrew-tap/Casks/aio-coding-hub.rb

          cd homebrew-tap
          if git diff --quiet -- Casks/aio-coding-hub.rb; then
            echo "Homebrew Cask is already up to date."
            exit 0
          fi

          git add Casks/aio-coding-hub.rb
          git commit -m "chore: update aio-coding-hub $RELEASE_TAG"
          git -c http.extraheader="$auth_header" push origin HEAD
